name: test

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node cli.js test # every .test.moth file, with Moth's own test runner
      - run: node cli.js fmt --check *.moth tools/*.moth # and all the Moth here is tidy
