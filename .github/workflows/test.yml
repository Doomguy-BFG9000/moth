name: test

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo build --release --manifest-path native/Cargo.toml # the Rust engine, which native.test.js holds up against the others
      - run: rustup target add wasm32-wasip1 && cargo build --release --target wasm32-wasip1 # and the same engine as WebAssembly
        working-directory: native # where its .cargo/config.toml is
      - run: cargo clippy --release --manifest-path native/Cargo.toml -- -D clippy::correctness -D clippy::suspicious -D clippy::perf # style lints change with each Rust, so they only warn
      - run: cargo fmt --check --manifest-path native/Cargo.toml
      - uses: bytecodealliance/actions/wasmtime/setup@v1 # a WebAssembly runtime with no JavaScript, to run moth-native.wasm in
      - run: npm test
        env:
          MOTH_WASI: wasmtime
      - run: node cli.js test # every .test.moth file, with Moth's own test runner
      - run: native/target/release/moth-native test # and with the Rust engine's
      - run: node cli.js fmt --check *.moth tools/*.moth apps/*.moth # and all the Moth here is tidy
