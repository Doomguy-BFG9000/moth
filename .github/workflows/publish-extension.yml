name: publish the VS Code extension

# Publishes editors/vscode to the Visual Studio Marketplace and Open VSX, when it's run by hand: Actions, "publish
# the VS Code extension", Run workflow (docs/publishing-the-extension.md says what to set up first). It packs the
# extension once, checks and tests that .vsix, and publishes that same file to each: to the Marketplace with the
# VSCE_PAT secret and to Open VSX with OVSX_PAT, each only if its secret is set. vsce and ovsx read the tokens
# from the environment, so they're never on a command line, and GitHub hides secrets in the log.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-extension
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error title=Not from main::The extension is published only from main, as it's merged; this was run on ${GITHUB_REF}."
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: pack the extension
        working-directory: editors/vscode
        run: |
          npm ci --no-audit --no-fund
          npx @vscode/vsce package
          npx @vscode/vsce ls
          node check-package.mjs
          echo "VSIX=$(ls moth-*.vsix)" >> "$GITHUB_ENV"
      - name: test it in VS Code
        run: |
          node bootstrap.mjs
          cd editors/vscode
          xvfb-run -a node e2e/run.mjs "$VSIX"
      - uses: actions/upload-artifact@v4
        with:
          name: moth-vscode-extension
          path: editors/vscode/moth-*.vsix

      - name: publish to the Visual Studio Marketplace
        working-directory: editors/vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::notice title=Not published to the Marketplace::There's no VSCE_PAT secret, so $VSIX wasn't published to the Visual Studio Marketplace. docs/publishing-the-extension.md says how to make one."
            exit 0
          fi
          npx @vscode/vsce publish --packagePath "$VSIX"
      - name: publish to Open VSX
        working-directory: editors/vscode
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::notice title=Not published to Open VSX::There's no OVSX_PAT secret, so $VSIX wasn't published to Open VSX. docs/publishing-the-extension.md says how to make one."
            exit 0
          fi
          npx ovsx publish --packagePath "$VSIX"
