ShortDescription: A programming language that reads like plain English.
Description: |-
  Moth is a programming language that reads like plain English: small enough to learn in an afternoon, with a compiler written in Moth itself that makes Windows and Linux programs as fast as C. moth runs a program, builds it into a program of its own, and has a shell, a debugger, tests, packages, a language server and a standard library from web servers and databases to pictures and encryption. It is one file, with nothing else to install.
